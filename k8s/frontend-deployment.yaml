apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movie-frontend
  template:
    metadata:
      labels:
        app: movie-frontend
    spec:
      containers:
        - name: movie-frontend
          image: movie-frontend:latest
          ports:
            - containerPort: 80
